<title>Subject Psychometrics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a filter bar over a single column of subject cards; each session is a row of small charts that wrap. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --ink: #15222b;
  --muted: #586874;
  --faint: #8a98a2;
  --rule: #dbe2e6;
  --chip: #e7edf0;
  --accent: #1f5c80;
  --accent-soft: #dcebf4;
  --warn: #8a5300;
  --warn-soft: #f8ecd8;
  --green: #008300;
  --red: #e34948;
  --font-ui: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #162027; --ink: #e4ecf0; --muted: #9eb0bb; --faint: #6f818c; --rule: #26333c;
    --chip: #1e2a32; --accent: #79b7de; --accent-soft: #1b3241; --warn: #e3a64f; --warn-soft: #33270f;
    --green: #2a9a2a; --red: #e66767; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #162027; --ink: #e4ecf0; --muted: #9eb0bb; --faint: #6f818c; --rule: #26333c;
  --chip: #1e2a32; --accent: #79b7de; --accent-soft: #1b3241; --warn: #e3a64f; --warn-soft: #33270f;
  --green: #2a9a2a; --red: #e66767; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 72ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--font-data); font-size: 0.82rem; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 500; }
details.method { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
details.method summary { cursor: pointer; font-weight: 600; }
details.method ul { margin: 8px 0 2px; padding-left: 18px; color: var(--muted); max-width: 90ch; }
details.method li { margin: 3px 0; }

.filters {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--rule);
}
.filters label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.filters input[type="search"], .filters select {
  font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 8px; text-transform: none; letter-spacing: 0;
}
.filters input[type="search"] { width: 9rem; }
.filters .check { text-transform: none; letter-spacing: 0; font-size: 0.88rem; color: var(--ink); }
.filters .count { margin-left: auto; font-family: var(--font-data); font-size: 0.82rem; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.subject { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px 16px; display: grid; gap: 12px; }
.subject header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.sid { font-family: var(--font-data); font-size: 1.25rem; font-weight: 500; margin-right: 4px; }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.chip.subtype { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.flag { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.82rem; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }

.session { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 10px; }
.session h3 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.panels { display: flex; flex-wrap: wrap; gap: 14px; }
.panel { width: 272px; max-width: 100%; display: grid; gap: 2px; align-content: start; }
.panel .t { font-size: 0.82rem; font-weight: 600; }
.panel .s { font-size: 0.74rem; color: var(--muted); font-family: var(--font-data); }
.panel svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 12px; font-size: 0.74rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 4px; align-items: center; }
.empty { font-size: 0.8rem; color: var(--faint); padding: 18px 0; }
details.conds summary { cursor: pointer; font-size: 0.84rem; color: var(--accent); font-weight: 600; width: fit-content; }
details.conds[open] summary { margin-bottom: 8px; }
.note { font-size: 0.78rem; color: var(--muted); }

svg .axis { stroke: var(--rule); stroke-width: 1; fill: none; }
svg .guide { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
svg .tick { fill: var(--faint); font: 9px var(--font-data); }
svg .lab { fill: var(--muted); font: 9.5px var(--font-ui); }
svg .curve { fill: none; stroke-width: 2; }
svg .pt { stroke: var(--surface); stroke-width: 1.5; cursor: default; }
svg .bar-lab { fill: var(--ink); font: 10px var(--font-data); }
#tip {
  position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--surface); font: 11px var(--font-data);
  padding: 4px 7px; border-radius: 4px; white-space: nowrap;
}
@media (max-width: 520px) { .filters .count { margin-left: 0; width: 100%; } .panel { width: 100%; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <div>
    <h1>Subject psychometrics</h1>
    <p class="lede">Every subject of the four sites, from the compiled sessions. Each session shows its practice and all of its trial
      blocks pooled; where blocks ran with different priors, open <em>prior conditions</em> to see each one on its own.</p>
  </div>
  <div class="stats" id="stats"></div>
  <details class="method">
    <summary>How this page is made</summary>
    <ul id="method"></ul>
  </details>
  <div class="filters" role="search">
    <label for="q">Subject <input type="search" id="q" placeholder="e.g. P33"></label>
    <label for="site">Site <select id="site"><option value="">All</option></select></label>
    <label for="group">Group <select id="group"><option value="">All</option><option value="pd">Patients</option><option value="hc">Controls</option></select></label>
    <label for="subtype">Subtype <select id="subtype"><option value="">All</option></select></label>
    <label class="check" for="mixed"><input type="checkbox" id="mixed"> Mixed block priors only</label>
    <span class="count" id="count"></span>
  </div>
  <div id="list" class="wrap"></div>
</div>
<div id="tip" hidden></div>

<script type="application/json" id="report-data">/*__REPORT_DATA__*/null</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("report-data").textContent);
  if (!data) { document.getElementById("list").textContent = "No data: run scripts/pipeline/subject_profiles.py."; return; }
  const subjects = data.subjects;
  const NS = "http://www.w3.org/2000/svg";
  const W = 272, H = 196, M = { l: 34, r: 10, t: 10, b: 30 };
  const X = v => M.l + (v + 100) / 200 * (W - M.l - M.r);
  const Y = v => M.t + (1 - v) * (H - M.t - M.b);
  const tip = document.getElementById("tip");
  const PRIOR_WORDS = p => p.split("+").map(q => `${q[0] === "g" ? "green" : "red"} 75% ${q[1] === "r" ? "right" : "left"}`).join(", ");

  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function html(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function fitAt(f, x) { return f.guess_rate + (1 - f.guess_rate - f.lapse_rate) / (1 + Math.exp(-f.var * (x - f.mean))); }
  function blocksText(b) { return (b.length > 1 ? "blocks " : "block ") + b.join(","); }
  function showTip(evt, text) { tip.textContent = text; tip.hidden = false; tip.style.left = (evt.clientX + 12) + "px"; tip.style.top = (evt.clientY - 28) + "px"; }
  function hideTip() { tip.hidden = true; }
  function glyph(colour) {
    const s = el("svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" });
    if (colour === "green") el("circle", { cx: 6, cy: 6, r: 4.2, fill: "var(--green)" }, s);
    else el("path", { d: "M6 1.5 L10.5 10 L1.5 10 Z", fill: "var(--red)" }, s);
    return s;
  }

  function frame(svg, yTicks, yLabel) {
    el("line", { class: "guide", x1: X(0), x2: X(0), y1: Y(1.02), y2: Y(0) }, svg);
    el("line", { class: "guide", x1: X(-100), x2: X(100), y1: Y(0.5), y2: Y(0.5) }, svg);
    el("polyline", { class: "axis", points: `${M.l},${M.t} ${M.l},${H - M.b} ${W - M.r},${H - M.b}` }, svg);
    for (const v of [-100, -35, 0, 35, 100]) el("text", { class: "tick", x: X(v), y: H - M.b + 12, "text-anchor": "middle" }, svg, v);
    for (const v of yTicks) el("text", { class: "tick", x: M.l - 5, y: Y(v) + 3, "text-anchor": "end" }, svg, v);
    el("text", { class: "lab", x: (M.l + W - M.r) / 2, y: H - 3, "text-anchor": "middle" }, svg, "signed coherence (%) · + = target right");
    el("text", { class: "lab", transform: `translate(9 ${(M.t + H - M.b) / 2}) rotate(-90)`, "text-anchor": "middle" }, svg, yLabel);
  }

  function psychChart(colours, label) {
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
    frame(svg, [0, 0.5, 1], "P(choose right)");
    for (const colour of ["green", "red"]) {
      const c = colours[colour]; if (!c) continue;
      if (c.fit) {
        let d = ""; for (let x = -100; x <= 100; x += 2) d += (d ? " L" : "M") + X(x).toFixed(1) + " " + Y(fitAt(c.fit, x)).toFixed(1);
        el("path", { class: "curve", d, stroke: `var(--${colour})`, "stroke-dasharray": c.role === "equal" ? "5 4" : "none" }, svg);
      }
      for (const [x, y, n] of c.points) {
        const tipText = `${colour}${c.role ? " (" + c.role + ")" : ""} · ${x > 0 ? "+" : ""}${x}% · P(right) ${y.toFixed(2)} · n=${n}`;
        const g = el("g", {}, svg);
        if (colour === "green") el("circle", { class: "pt", cx: X(x), cy: Y(y), r: 4.2, fill: "var(--green)" }, g);
        else el("path", { class: "pt", d: `M${X(x)} ${Y(y) - 5} L${X(x) + 4.6} ${Y(y) + 3.5} L${X(x) - 4.6} ${Y(y) + 3.5} Z`, fill: "var(--red)" }, g);
        el("circle", { cx: X(x), cy: Y(y), r: 9, fill: "transparent" }, g);  // larger hover target
        g.addEventListener("mousemove", e => showTip(e, tipText));
        g.addEventListener("mouseleave", hideTip);
      }
    }
    return svg;
  }

  function accuracyChart(colours, label) {
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label });
    const yAt = v => M.t + (1 - v) * (H - M.t - M.b);
    el("polyline", { class: "axis", points: `${M.l},${M.t} ${M.l},${H - M.b} ${W - M.r},${H - M.b}` }, svg);
    for (const v of [0, 0.5, 1]) el("text", { class: "tick", x: M.l - 5, y: yAt(v) + 3, "text-anchor": "end" }, svg, v);
    el("text", { class: "lab", transform: `translate(9 ${(M.t + H - M.b) / 2}) rotate(-90)`, "text-anchor": "middle" }, svg, "accuracy");
    ["green", "red"].forEach((colour, i) => {
      const c = colours[colour]; if (!c) return;
      const bw = 58, cx = M.l + (W - M.l - M.r) * (i === 0 ? 0.3 : 0.7);
      const top = yAt(Math.min(c.acc, 1));
      el("rect", { x: cx - bw / 2, y: top, width: bw, height: H - M.b - top, rx: 3, fill: `var(--${colour})`, opacity: colour === "red" ? 0.85 : 1 }, svg);
      el("text", { class: "bar-lab", x: cx, y: top - 5, "text-anchor": "middle" }, svg, `${Math.round(100 * c.acc)}%  n=${c.n}`);
      el("text", { class: "tick", x: cx, y: H - M.b + 12, "text-anchor": "middle" }, svg, colour);
    });
    return svg;
  }

  function legend(colours) {
    const box = html("div", "legend");
    for (const colour of ["green", "red"]) {
      const c = colours[colour]; if (!c) continue;
      const s = html("span"); s.appendChild(glyph(colour));
      s.appendChild(document.createTextNode(colour + (c.role ? ` (${c.role}${c.role === "equal" ? ", dashed" : ""})` : "")));
      box.appendChild(s);
    }
    return box;
  }

  function panel(title, sub, chart, colours) {
    const p = html("div", "panel");
    p.appendChild(html("div", "t", title));
    p.appendChild(html("div", "s", sub));
    p.appendChild(chart);
    if (colours) p.appendChild(legend(colours));
    return p;
  }

  function practicePanel(s) {
    const pr = s.practice;
    if (!pr) { const p = html("div", "panel"); p.appendChild(html("div", "t", "Practice")); p.appendChild(html("div", "empty", "No practice recorded in this session.")); return p; }
    if (pr.kind === "accuracy") return panel("Practice", `100% coherence only · ${pr.n} trials`, accuracyChart(pr.colours, `${s.label} practice accuracy`), null);
    return panel("Practice", `all coherences, no prior · ${pr.n} trials`, psychChart(pr.colours, `${s.label} practice psychometric`), pr.colours);
  }

  function sessionBlock(s) {
    const box = html("section", "session");
    box.appendChild(html("h3", "", s.label === "session" ? "Session" : s.label));
    const row = html("div", "panels");
    row.appendChild(practicePanel(s));
    const mixed = s.conditions.length > 1;
    const title = mixed ? `All trial blocks · priors ${s.all.priors.join(" | ")}` : `All trial blocks · ${s.all.priors[0]}`;
    const sub = `${blocksText(s.all.blocks)} · ${s.all.n} trials` + (mixed ? "" : ` · ${s.all.priors[0] === "none" ? "no prior" : PRIOR_WORDS(s.all.priors[0])}`);
    row.appendChild(panel(title, sub, psychChart(s.all.colours, `${s.label} all trial blocks`), s.all.colours));
    box.appendChild(row);
    if (mixed) {
      const det = html("details", "conds");
      det.appendChild(html("summary", "", `Prior conditions (${s.conditions.length}): ` + s.conditions.map(c => `${c.prior} in ${blocksText(c.blocks)}`).join("; ")));
      const inner = html("div", "panels");
      det.appendChild(inner);
      det.addEventListener("toggle", () => {
        if (!det.open || inner.childElementCount) return;
        for (const c of s.conditions) {
          inner.appendChild(panel(`${c.prior} · ${c.prior === "none" ? "no prior" : c.describe}`, `${blocksText(c.blocks)} · ${c.n} trials`,
            psychChart(c.colours, `${s.label} ${c.prior}`), c.colours));
        }
      });
      box.appendChild(det);
    }
    return box;
  }

  const yesNo = v => v === null || v === undefined ? "unknown" : (v ? "yes" : "no");
  function card(sub) {
    const art = html("article", "subject"); art.id = sub.id;
    const head = html("header");
    head.appendChild(html("span", "sid", sub.id));
    head.appendChild(html("span", "chip", sub.site));
    head.appendChild(html("span", "chip", sub.group === "pd" ? "patient" : "control"));
    if (sub.group === "pd") head.appendChild(html("span", "chip subtype", sub.subtype ? `${sub.subtype} dominant` : "subtype not classified"));
    if (sub.sessions.some(s => s.conditions.length > 1)) head.appendChild(html("span", "chip flag", "mixed block priors"));
    art.appendChild(head);
    if (sub.group === "pd") {
      const facts = html("div", "facts");
      const f = (k, v) => { const s = html("span"); s.appendChild(html("b", "", k + " ")); s.appendChild(document.createTextNode(v)); facts.appendChild(s); };
      f("Subtype", sub.subtype ? `${sub.subtype} (tremor/bradykinesia ${sub.tremor_bradykinesia_ratio.toFixed(2)}, OFF UPDRS)` : sub.subtype_note);
      f("OFF first, metadata", yesNo(sub.off_first_metadata) + (sub.off_first_metadata === null ? ` (${sub.off_first_metadata_note})` : ""));
      f("OFF first, recordings", yesNo(sub.off_first_recorded) + ` (${sub.off_first_recorded_note})`);
      art.appendChild(facts);
    }
    for (const s of sub.sessions) art.appendChild(sessionBlock(s));
    return art;
  }

  // header numbers and method notes
  const sites = [...new Set(subjects.map(s => s.site))];
  const nSessions = subjects.reduce((a, s) => a + s.sessions.length, 0);
  const stats = document.getElementById("stats");
  [[subjects.length, "subjects"], [subjects.filter(s => s.group === "pd").length, "patients"], [subjects.filter(s => s.group === "hc").length, "controls"],
   [nSessions, "sessions"], [sites.length, "sites"], [data.generated, "generated"]].forEach(([v, k]) => {
    const s = html("span"); s.appendChild(html("b", "", String(v))); s.appendChild(document.createTextNode(" " + k)); stats.appendChild(s);
  });
  const method = [
    `Trials: valid trials with a reaction time of at least ${data.min_rt_ms} ms, from the compiled sessions (compiled/<site>/sessions).`,
    "Psychometric functions: P(choose right) against signed coherence (positive when the target was on the right), per stimulus colour, fitted with a four-parameter logistic. Hover a point for its value and trial count.",
    "Priors: gr = green targets 75% right, rl = red targets 75% left, and so on; gr+rl means both colours were biased. The prior colour is drawn solid and the 50:50 colour dashed. A block's prior is read from its own trials, never from file names.",
    "All trial blocks: every trial block of the session pooled. Where blocks implied different priors, Prior conditions shows each prior on its own, with the blocks it covers.",
    "Practice: accuracy per colour when practice was at 100% coherence only; a psychometric function when it included lower coherences.",
    "Subtype: tremor/bradykinesia ratio of the OFF-medication MDS-UPDRS exam (rule of notebook 0.30), for Stanford and Harvard patients only.",
    "OFF first: from the metadata, and from the recordings where they date the sessions (Harvard and Stanford session dates; Case Western clock when OFF and ON ran in one sitting).",
  ];
  const ul = document.getElementById("method");
  for (const m of method) ul.appendChild(html("li", "", m));

  // filters
  const siteSel = document.getElementById("site"), subSel = document.getElementById("subtype");
  for (const s of sites) { const o = html("option", "", s); o.value = s; siteSel.appendChild(o); }
  for (const s of [...new Set(subjects.filter(s => s.group === "pd").map(s => s.subtype || "not classified"))].sort()) { const o = html("option", "", s); o.value = s; subSel.appendChild(o); }
  const list = document.getElementById("list");
  const cards = subjects.map(s => { const c = card(s); list.appendChild(c); return [s, c]; });
  const q = document.getElementById("q"), grp = document.getElementById("group"), mixed = document.getElementById("mixed"), count = document.getElementById("count");
  function apply() {
    const text = q.value.trim().toLowerCase();
    let shown = 0;
    for (const [s, c] of cards) {
      const ok = (!text || s.id.toLowerCase().includes(text)) && (!siteSel.value || s.site === siteSel.value) && (!grp.value || s.group === grp.value)
        && (!subSel.value || (s.group === "pd" && (s.subtype || "not classified") === subSel.value))
        && (!mixed.checked || s.sessions.some(x => x.conditions.length > 1));
      c.hidden = !ok; if (ok) shown++;
    }
    count.textContent = `${shown} of ${subjects.length} subjects`;
  }
  [q, siteSel, grp, subSel, mixed].forEach(e => e.addEventListener("input", apply));
  apply();
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
